<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="Simple link building illustration">
  <rect width="720" height="520" fill="#0a0a0a"/>
  <rect x="0" y="0" width="720" height="520" fill="#c2081f" opacity="0.92"/>
  <!-- chain / link motif -->
  <rect x="210" y="200" width="160" height="70" rx="35" fill="none" stroke="#fff" stroke-width="18"/>
  <rect x="350" y="200" width="160" height="70" rx="35" fill="none" stroke="#fff" stroke-width="18"/>
  <circle cx="180" cy="360" r="48" fill="#fff" opacity="0.15"/>
  <circle cx="540" cy="140" r="64" fill="#fff" opacity="0.12"/>
  <text x="72" y="100" fill="#fff" font-family="Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="2">TRUST</text>
  <text x="72" y="450" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="600" opacity="0.85">White-hat links</text>
</svg>
